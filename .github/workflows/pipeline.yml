name: Pipeline
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 3"

permissions:
  contents: write

concurrency:
  group: "ranking"
  # group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Cache uv virtual environment
      uses: actions/cache@v4
      with:
        path: .venv
        key: ${{ runner.os }}-uv
        restore-keys: |
          ${{ runner.os }}-uv

    - name: Setup virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        pip install -e .
        pip install polars datasets ipywidgets scikit-learn altair vl-convert-python networkx hdbscan nltk bertopic matplotlib umap-learn jupyter nbconvert
    # - name: Get Dataset Timestamp
    #   run: cd src && uv run python rank_comparia/latest-timestamp.py >> $GITHUB_ENV
    # FIXME: check if release for DATASET_TIMESTAMP already computed
    # - name: Download models data
    #   run: curl https://comparia.beta.gouv.fr/available_models -o ./data/models_data.json
    - name: Exec export script
      run: |
        cd src && uv run python rank_comparia/export.py || true
      env:
        HF_DATASETS_CACHE: cache
        HF_HUB_CACHE: cache
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    - name: Upload outputs
      uses: actions/upload-artifact@v4
      with:
        name: outputs
        path: src/output/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release_${{ github.run_id }}
        name: Release ${{ github.run_id }}
        body: |
          Release automatique générée par la pipeline CI/CD
          
          Basé sur les dataset "ministere-culture/comparia-*"
          avec id: ${{ github.run_id }}
          
          Contient les données finales du classement depuis ml_final_data.json
        draft: false
        prerelease: false
        generate_release_notes: true

    # - name: Publish ml_final_data.json as release
