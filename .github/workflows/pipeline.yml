    - name: Push ml_final_data.json to Hugging Face dataset
      if: github.ref == 'refs/heads/main'
      run: |
          # Check if ml_final_data.json has changes
          if git diff --quiet HEAD -- utils/ranking_methods/output/ml_final_data.json; then
            echo "No changes to ml_final_data.json, skipping Hugging Face push"
            exit 0
          fi
          
          # Set up huggingface_hub using uv
          uv pip install huggingface_hub
          
          # Push to Hugging Face using huggingface_hub CLI
          echo "Pushing ml_final_data.json to Hugging Face dataset"
          huggingface-cli upload \
            ${{ secrets.HF_DATASET_REPO }} \
            $TEMP_DIR \
            "." \
            --token ${{ secrets.HF_PUSH_DATASET_KEY }} \
            --repo-type dataset \
            --message "Update ml_final_data.json with latest data $(date +%Y-%m-%d\ %H:%M:%S)"
      env:
          HF_PUSH_DATASET_KEY: ${{ secrets.HF_PUSH_DATASET_KEY }}


